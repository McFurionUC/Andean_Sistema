<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Reservas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
        button.cancelar {
            background-color: #dc3545;
        }
        button:hover {
            opacity: 0.9;
        }
        .container {
            max-width: 600px;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: 0 auto; /* Centra horizontalmente el contenedor */
            text-align: center; /* Centra el texto dentro del contenedor */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reserva tu Viaje</h1>
        <form id="reservaForm" onsubmit="crearReserva(event)">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo" required>
            
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico" required>
            
            <label for="destino">Destino</label>
            <input type="text" id="destino" name="destino" placeholder="Ingresa el destino" required>
            
            <label for="cupos">Cantidad de Cupos</label>
            <input type="number" id="cupos" name="cupos" min="1" max="10" placeholder="Número de cupos" required>

            <label for="tipoPasajero">Tipo de Pasajero</label>
            <select id="tipoPasajero" name="tipoPasajero" required>
                <option value="adulto">Adulto</option>
                <option value="niño">Niño</option>
            </select>
            
            <label for="servicio">Tipo de Servicio</label>
            <select id="servicio" name="servicio" required>
                <option value="economico">Económico</option>
                <option value="intermedio">Intermedio</option>
                <option value="premium">Premium</option>
            </select>

            <button type="submit">Crear Reserva</button>
            <button type="button" class="cancelar" onclick="cancelarReserva()">Cancelar Reserva</button>
        </form>
    </div>

    <script>
        function crearReserva(event) {
            event.preventDefault();
            let nombre = document.getElementById('nombre').value;
            let email = document.getElementById('email').value;
            let destino = document.getElementById('destino').value;
            let cupos = document.getElementById('cupos').value;
            let tipoPasajero = document.getElementById('tipoPasajero').value;
            let servicio = document.getElementById('servicio').value;

            // Aquí puedes enviar la información al servidor o mostrar una alerta
            alert(`Reserva creada:\nNombre: ${nombre}\nEmail: ${email}\nDestino: ${destino}\nCupos: ${cupos}\nTipo de pasajero: ${tipoPasajero}\nServicio: ${servicio}`);
        }

        function cancelarReserva() {
            if (confirm('¿Estás seguro de que deseas cancelar la reserva?')) {
                document.getElementById('reservaForm').reset();
                alert('Reserva cancelada');
            }
        }
    </script>
</body>
</html>
